name: 每日股市日报

on:
  schedule:
    # 每天到点就触发，具体哪天跑由 Python 里判断（避免 cron 范围兼容问题）
    - cron: '17 23 * * *'   # 北京时间 7:17
    - cron: '17 14 * * *'   # 北京时间 22:17
  workflow_dispatch:  # 手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Stock Report
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python stock_report.py

      - name: Commit HTML to Repo
        if: steps.generate.outputs.skip != '1'
        run: |
          # 只提交轻量的 HTML 报告（PDF 与历史 charts 均已被 gitignore 排除）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add docs/*.html docs/index.html docs/.nojekyll docs/style.css docs/script.js || true
          git add docs/charts/ || true
          git diff --cached --quiet || git commit -m "update: 股市日报 $(date +%Y-%m-%d)"
          # 推送失败必须显式暴露（此前 `git push || true` 会静默吞掉，报告丢失无任何告警）
          git push || { sleep 15 && git pull origin main --rebase && git push; }

      - name: Setup Pages
        if: steps.generate.outputs.skip != '1'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.generate.outputs.skip != '1'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: steps.generate.outputs.skip != '1'
        uses: actions/deploy-pages@v5
