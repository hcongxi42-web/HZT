name: 每日股市日报

on:
  schedule:
    # 每天到点就触发，具体哪天跑由 Python 里判断（避免 cron 范围兼容问题）
    - cron: '17 23 * * *'   # 北京时间 7:17
    - cron: '17 14 * * *'   # 北京时间 22:17
  workflow_dispatch:  # 手动触发
    inputs:
      session:
        description: '补发场次：留空=按执行时间自动判断；填 am 出早报，填 pm 出晚报'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

# 同一时刻只允许一个运行排队执行。
# 2026-10-15 事故：两个运行并发各自生成同名的 report_20261015_am.html，
# 后到的那个在 git pull --rebase 时撞上 add/add 冲突 → 「Commit HTML to Repo」
# 失败 → 其后三步部署全部跳过，报告生成成功却没上线。
# cancel-in-progress 保持 false：宁可排队，也不要打断正在推送的运行。
concurrency:
  group: daily-stock-report
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate Stock Report
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 可选：在仓库 Settings → Variables 里设 DEEPSEEK_MODEL 即可换模型，无需改代码
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # 触发本次运行的 cron 表达式：用于精确判定早报/晚报（调度延迟跨午夜也不会误判）
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          # 手动补发指定场次（workflow_dispatch 的 session 输入）；定时触发下为空，走上面的 cron 判定
          REPORT_SESSION: ${{ github.event.inputs.session }}
        run: python stock_report.py

      - name: Commit HTML to Repo
        if: steps.generate.outputs.skip != '1'
        run: |
          # 只提交轻量的 HTML 报告（PDF 导出逻辑已移除；charts 由 gitignore 保护）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add docs/*.html docs/index.html docs/.nojekyll docs/style.css docs/script.js || true
          git add docs/charts/ || true
          git diff --cached --quiet || git commit -m "update: 股市日报 $(date +%Y-%m-%d)"
          # 推送失败必须显式暴露（此前 `git push || true` 会静默吞掉，报告丢失无任何告警）
          git push || { sleep 15 && git pull origin main --rebase && git push; }

      - name: Setup Pages
        if: steps.generate.outputs.skip != '1'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.generate.outputs.skip != '1'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: steps.generate.outputs.skip != '1'
        uses: actions/deploy-pages@v5
