name: 每日股市日报

on:
  schedule:
    # 每天到点就触发，具体哪天跑由 Python 里判断（避免 cron 范围兼容问题）
    - cron: '17 23 * * *'   # 北京时间 7:17
    - cron: '17 14 * * *'   # 北京时间 22:17
  workflow_dispatch:  # 手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Generate Stock Report
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python stock_report.py

      - name: Commit HTML + Charts to Repo
        if: steps.generate.outputs.skip != '1'
        run: |
          # 只提交轻量的 HTML 报告和图表（PDF 已被 gitignore 排除）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add docs/*.html docs/index.html docs/.nojekyll docs/style.css docs/script.js || true
          git add docs/charts/ || true
          git diff --cached --quiet || git commit -m "update: 股市日报 $(date +%Y-%m-%d)"
          git push || true

      - name: Upload PDF Artifact (before cleanup)
        if: steps.generate.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          # 按日期命名，便于查找；加上 session slug 区分早晚报
          # 注意 v4 要求每次运行的 artifact name 唯一，这里加入日期+时间确保不冲突
          name: stock-report-${{ github.run_number }}
          path: |
            report_*.md
            docs/pdf/*.pdf
          # PDF 文件小（~1.5MB/个），retention 设长一些不浪费多少空间
          # 10GB 总量限制下：~1.5MB × 2次/天 × 90天 ≈ 270MB，完全没问题
          retention-days: 90

      - name: Strip PDFs from Pages artifact
        if: steps.generate.outputs.skip != '1'
        run: |
          # 保留 latest.pdf 供在线下载，删除其余 PDF（历史 PDF 通过 Artifact 保留）
          if [ -f docs/pdf/latest.pdf ]; then
            cp docs/pdf/latest.pdf /tmp/latest.pdf.backup
          fi
          rm -f docs/pdf/*.pdf
          mkdir -p docs/pdf
          if [ -f /tmp/latest.pdf.backup ]; then
            cp /tmp/latest.pdf.backup docs/pdf/latest.pdf
          fi
          echo "=== docs/ layout (after strip) ==="
          du -sh docs/ docs/*/ 2>/dev/null || true

      - name: Setup Pages
        if: steps.generate.outputs.skip != '1'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.generate.outputs.skip != '1'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: steps.generate.outputs.skip != '1'
        uses: actions/deploy-pages@v5

      - name: Keep workflow alive
        if: steps.generate.outputs.skip != '1'
        run: |
          if [ $(git log -1 --format=%ct) -lt $(date -d '50 days ago' +%s 2>/dev/null || date -v-50d +%s 2>/dev/null || echo 0) ]; then
            date -u > .github/.keepalive
            git add .github/.keepalive
            git commit -m "chore: keep workflow alive" || true
            git push || true
          fi
