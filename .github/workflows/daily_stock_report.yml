name: 每日股市日报

on:
  schedule:
    # UTC 时间，北京时间 = UTC + 8
    - cron: '30 0 * * 1-5'   # 工作日 8:30
    - cron: '30 7 * * 1-5'   # 工作日 15:30
  workflow_dispatch:  # 手动触发

permissions:
  contents: write
  pages: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Stock Report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python stock_report.py

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add docs/ || true
          git diff --cached --quiet || git commit -m "update: 股市日报 $(date +%Y-%m-%d)"
          git push || true

      - name: Keep workflow alive
        run: |
          # GitHub disables scheduled workflows after 60 days of repo inactivity.
          # This step ensures there's always a recent commit to prevent that.
          if [ $(git log -1 --format=%ct) -lt $(date -d '50 days ago' +%s 2>/dev/null || date -v-50d +%s 2>/dev/null || echo 0) ]; then
            date -u > .github/.keepalive
            git add .github/.keepalive
            git commit -m "chore: keep workflow alive" || true
            git push || true
          fi

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: stock-report-${{ github.run_number }}
          path: |
            report_*.md
            docs/*.html
          retention-days: 30
